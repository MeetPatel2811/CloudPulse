name: Frontend CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend project
        id: frontend
        shell: bash
        run: |
          if [[ ! -f frontend/package.json ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No frontend project exists yet; skipping the frontend build."
          elif [[ ! -f frontend/package-lock.json ]]; then
            echo "::error::frontend/package-lock.json is required for npm ci."
            exit 1
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.frontend.outputs.available == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test, and build
        if: steps.frontend.outputs.available == 'true'
        working-directory: ./frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Install Playwright Chromium
        if: steps.frontend.outputs.available == 'true'
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end test
        if: steps.frontend.outputs.available == 'true'
        working-directory: ./frontend
        run: npm run test:e2e
