services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cloudpulse
      POSTGRES_USER: cloudpulse
      POSTGRES_PASSWORD: cloudpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpulse -d cloudpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  demo-standard:
    build:
      context: ./demo-services/demo-standard
    ports:
      - "8081:8081"

  demo-legacy:
    build:
      context: ./demo-services/demo-legacy
    ports:
      - "8082:8082"

  demo-flaky:
    build:
      context: ./demo-services/demo-flaky
    ports:
      - "8083:8083"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
